name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - run: dotnet restore FlatTree.slnx

      - run: dotnet build FlatTree.slnx -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - run: dotnet run --project tests/FlatTree.Tests/FlatTree.Tests.csproj -c Release --no-build

      - run: dotnet pack src/FlatTree/FlatTree.csproj -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o artifacts

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: ${{ steps.ver.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*.nupkg artifacts/*.snupkg \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG
