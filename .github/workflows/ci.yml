name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore FlatTree.slnx

      - run: dotnet build FlatTree.slnx -c Release --no-restore

      - run: dotnet run --project tests/FlatTree.Tests/FlatTree.Tests.csproj -c Release --no-build

      - name: Pack (dry run)
        run: dotnet pack src/FlatTree/FlatTree.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ github.sha }}
          path: artifacts/*.nupkg
          retention-days: 7
